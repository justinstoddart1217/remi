# Alembic configuration for Remi.
#
# The app migrates itself on startup (app.core.migrations.upgrade_to_head, with a backup
# first), and `remi db upgrade` does the same by hand. This file is for development:
#   uv run alembic upgrade head          # the database in REMI_DATA_DIR (or the default)
#   uv run alembic revision --autogenerate -m "..."
# sqlalchemy.url is left empty on purpose; env.py resolves the database from RemiConfig.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
