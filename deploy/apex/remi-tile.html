<!--
  The "remi" tile for APEX's landing page.

  Remi runs on the same server as APEX, on its own port (8765). This tile is only a link to it:
  APEX and Remi share nothing else (no login, no database).

  Where it goes: APEX's landing page is a Jinja template in APEX's Flask app (the file that
  holds the other tiles, often templates/index.html). Paste ONE of the two versions below
  beside the other tiles, save, and reload APEX.

  The link: {{ request.host.split(':')[0] }} is the server name you typed to open APEX, so the
  tile follows whatever name you use. If the page is not a Jinja template, write the server's
  name instead, for example http://apexserver:8765/ . If you changed REMI_PORT in
  C:\Remi\server.env, change 8765 here too.
-->

<!-- Version 1: looks like APEX's other tiles. Copy an existing tile and change only its link
     and its text; "tile" below stands for whatever class APEX's tiles use. -->
<a class="tile" href="http://{{ request.host.split(':')[0] }}:8765/">remi</a>

<!-- Version 2: a tile styled in Ninety One's colours, self-contained. -->
<a class="remi-tile" href="http://{{ request.host.split(':')[0] }}:8765/">
  <span class="remi-tile__eyebrow">Planning</span>
  <span class="remi-tile__name">remi</span>
  <span class="remi-tile__note">Today, timeline and projects: Private Credit to Fixed Income</span>
</a>
<style>
  .remi-tile {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 220px;
    padding: 20px 22px;
    background: #134848;
    color: #ffffff;
    text-decoration: none;
    border-top: 3px solid #009d80;
    font-family: 'Segoe UI', Arial, sans-serif;
    transition: background 140ms ease-out;
  }
  .remi-tile:hover,
  .remi-tile:focus-visible {
    background: #0d3232;
  }
  .remi-tile:focus-visible {
    outline: 2px solid #7fe0c8;
    outline-offset: 2px;
  }
  .remi-tile__eyebrow {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7fe0c8;
  }
  .remi-tile__name {
    font-size: 26px;
    font-weight: 500;
  }
  .remi-tile__note {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
  }
</style>
