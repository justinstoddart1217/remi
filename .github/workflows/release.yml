# The Windows server bundle for the APEX server (docs/deploy/APEX.md).
#
# A version tag (`make release VERSION=1.2.3` on the Mac pushes v1.2.3) builds
# remi-<version>-windows.zip, installs it on this Windows runner exactly as on the APEX server
# (C:\Remi, the startup task, server mode), checks it answers and survives an update, then
# publishes it as a GitHub Release, which the server's update-remi.bat downloads.
#
# Run it by hand (Actions > Release > Run workflow) to build and test without publishing; the
# zip is then attached to the run as an artifact.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-bundle:
    name: Build, install-test and publish the Windows bundle
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check the tag matches backend/pyproject.toml
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' backend/pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match backend/pyproject.toml ($version). Use make release."
            exit 1
          fi

      - name: Install the frontend's dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build the bundle
        working-directory: backend
        run: uv run --frozen --no-dev python -m scripts.build_bundle --out ../build/release

      - name: Install it as on the APEX server (install-remi.bat)
        shell: pwsh
        run: |
          $zip = Get-Item build/release/remi-*-windows.zip
          $stage = Join-Path $env:RUNNER_TEMP 'bundle'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $stage
          $bundle = Get-ChildItem -LiteralPath $stage -Directory | Select-Object -First 1
          Push-Location $bundle.FullName
          cmd /c "install-remi.bat < NUL"
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 0) { throw "install-remi.bat failed ($status)" }

      - name: Check Remi answers on the network, runs as LOCAL SERVICE and refuses other sites
        shell: pwsh
        run: |
          $version = (Get-Content C:\Remi\current.txt -TotalCount 1).Trim()
          $name = $env:COMPUTERNAME.ToLower()
          $base = "http://${name}:8765"
          $health = Invoke-RestMethod "$base/api/health"
          if ($health.app -ne 'remi' -or $health.version -ne $version) { throw "unexpected health: $($health | ConvertTo-Json)" }
          $page = Invoke-WebRequest "$base/"
          if ($page.Content -notmatch '<div id="root"') { throw 'the dashboard page did not load' }
          $owner = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.ExecutablePath -like 'C:\Remi\*' } | Invoke-CimMethod -MethodName GetOwner
          if ($owner.User -ne 'LOCAL SERVICE') { throw "Remi runs as $($owner.Domain)\$($owner.User), not LOCAL SERVICE" }
          $body = '{"moveDate":"2027-01-04","timezone":"Europe/London","holidayRegion":"GB-ENG"}'
          $own = @{ Origin = $base; 'X-Remi-Client' = '1' }
          Invoke-RestMethod -Method Post "$base/api/setup" -Headers $own -ContentType 'application/json' -Body $body | Out-Null
          $settings = Invoke-RestMethod "$base/api/settings"
          if ($settings.moveDate -ne '2027-01-04') { throw 'setup did not save' }
          $foreign = @{ Origin = 'http://evil.example:8765'; 'X-Remi-Client' = '1' }
          $status = 0
          try {
            Invoke-RestMethod -Method Patch "$base/api/settings" -Headers $foreign -ContentType 'application/json' -Body '{}' | Out-Null
          } catch { $status = [int] $_.Exception.Response.StatusCode }
          if ($status -ne 403) { throw "a foreign Origin got $status, not 403" }
          $hostStatus = curl.exe -s -o NUL -w '%{http_code}' -H 'Host: evil.example:8765' http://127.0.0.1:8765/api/health
          if ($hostStatus -ne '400') { throw "a foreign Host got $hostStatus, not 400" }
          cmd /c "C:\Remi\status-remi.bat < NUL"

      - name: Update from the zip, restart, and keep the data
        shell: pwsh
        run: |
          $zip = (Get-Item build/release/remi-*-windows.zip).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\Remi\remi-server.ps1 update -Zip $zip -Force
          if ($LASTEXITCODE -ne 0) { throw "update failed ($LASTEXITCODE)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\Remi\remi-server.ps1 restart
          if ($LASTEXITCODE -ne 0) { throw "restart failed ($LASTEXITCODE)" }
          $settings = Invoke-RestMethod http://127.0.0.1:8765/api/settings
          if ($settings.moveDate -ne '2027-01-04') { throw 'the data did not survive the update' }
          if (-not (Get-ChildItem C:\Remi\data\backups -File)) { throw 'the update made no backup' }

      - name: Show the logs
        if: always()
        shell: pwsh
        run: |
          foreach ($log in Get-ChildItem C:\Remi\logs -File -ErrorAction SilentlyContinue) {
            Write-Host "----- $($log.Name)"
            Get-Content $log.FullName -Tail 60
          }

      - name: Keep the zip with this run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: remi-windows-bundle
          path: build/release/
          retention-days: 7

      - name: Publish the release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" build/release/remi-*-windows.zip build/release/remi-*-windows.zip.sha256 \
            --title "Remi $version" \
            --notes "Windows server bundle for the APEX server. On the server, run C:\\Remi\\update-remi.bat (first time: unzip and run install-remi.bat). See docs/deploy/APEX.md."

      - name: Update through GitHub, as update-remi.bat does on the server
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          REMI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\Remi\remi-server.ps1 update -Repo $env:GITHUB_REPOSITORY -Force
          if ($LASTEXITCODE -ne 0) { throw "update from GitHub failed ($LASTEXITCODE)" }

      - name: Uninstall
        shell: pwsh
        run: |
          cmd /c "echo y| C:\Remi\uninstall-remi.bat"
          if (Get-ScheduledTask -TaskName Remi -ErrorAction SilentlyContinue) { throw 'the startup task is still there' }
          if (-not (Test-Path C:\Remi\data\remi.db)) { throw 'uninstall removed the data' }
